    <!-- Custom styling extensions for Thank You page -->
    <style>
        .thankyou-content {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 100px;
        }
        
        .thankyou-card {
            background: linear-gradient(var(--bg-dark-alt), var(--bg-dark));
            border: 1px solid var(--border-dark);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
            animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .thankyou-card .card-top-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, var(--primary) 50%, var(--accent-crimson));
        }

        .success-icon-box {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-icon-box svg {
            width: 40px;
            height: 40px;
        }

        .thankyou-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .thankyou-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 100px;
            font-weight: 700;
        }

        .btn-back svg {
            width: 20px;
            height: 20px;
            transition: var(--transition-smooth);
        }

        .btn-back:hover svg {
            transform: translateX(-4px);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.6);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .thankyou-card {
                padding: 40px 24px;
            }
            .thankyou-title {
                font-size: 1.6rem;
            }
            .thankyou-desc {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="navbar" id="main-header">
        <div class="container nav-container">
            <a href="/" class="logo" id="header-logo">
                <img src="https://appsglobal.co/images/logo.png" alt="AppsGlobal Logo">
                <span class="brand-name">Apps<span class="brand-accent">Global</span></span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="thankyou-content">
        <!-- Ambient Background Glows -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        
        <div class="container" style="display: flex; justify-content: center; align-items: center; width: 100%;">
            <div class="thankyou-card">
                <!-- Top Indicator Gradient (Starts with green for success) -->
                <div class="card-top-accent"></div>
                
                <!-- Success Checkmark Icon -->
                <div class="success-icon-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                
                <!-- Message -->
                <h1 class="thankyou-title">Assessment Request Submitted!</h1>
                <p class="thankyou-desc">
                    Thank you for scheduling your consultation. A dedicated software strategist from our team will review your application details and contact you within 24 hours to align on your growth goals.
                </p>
                
                <!-- Back Button -->
                <a href="/" class="btn btn-gradient btn-back">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Homepage</span>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
